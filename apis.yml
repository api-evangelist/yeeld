apis:
  - aid: yeeld:yeeld
    name: Yeeld Surcharging API
    description: >-
      Real-time surcharge calculation API. The caller sends a base transaction amount and
      payment-method details (card brand and type) and receives the permitted surcharge
      amount, evaluated against U.S. state and Canadian provincial statute, card-network
      caps, and the merchant's own configuration. Platforms pass a Yeeld-Account header to
      scope the calculation to a sub-merchant. Yeeld does not process payments or store
      card data. The endpoint reference and sandbox are gated behind a contact-sales form.
    humanURL: https://docs.theyeeld.com/integrations
    baseURL: https://api.theyeeld.com
