aid: yeeld
name: Yeeld
description: >-
  Yeeld builds credit-card surcharging infrastructure for merchants and platforms across
  the United States and Canada, and provides payments consulting and development services.
  The Yeeld Surcharging API is a real-time rules engine: a caller passes a transaction
  amount and payment-method details, and Yeeld returns the surcharge that jurisdictional
  law and Visa, Mastercard, American Express and Discover rules permit, or zero where
  surcharging is prohibited. Yeeld also ships a Stripe App Marketplace app for Stripe
  Checkout and Payment Links, and YeeldPay, a no-code branded hosted checkout. Founded by
  ex-Stripe staff and headquartered in Chicago, Illinois.
