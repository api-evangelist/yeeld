specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Yeeld
providerId: yeeld
created: '2026-05-04'
generated: '2026-08-28'
method: searched
modified: '2026-08-28'
source: >-
  All seven published pages of https://docs.theyeeld.com (crawled 2026-08-28),
  https://theyeeld.com/products/surcharging-api,
  plus live unauthenticated responses from https://api.theyeeld.com.
tags:
  - Rate Limiting
  - Quotas
  - Throttling
description: >-
  Yeeld publishes no rate limits, no quotas and no throttling response headers anywhere on
  its public surface. REPLACES the 2026-05-04 bulk-sweep scaffold, which asserted
  free/professional/enterprise tiers at 10/100/1000 requests per minute and monthly quotas
  of 1,000/100,000 — none of which Yeeld has ever published. An honest zero is the finding.
limit_count: 0
limits: []
headers:
  limit: null
  remaining: null
  reset: null
  retryAfter: null
  policy: null
  observed: false
  note: >-
    No X-RateLimit-*, RateLimit-* or Retry-After header appears on any unauthenticated
    response from api.theyeeld.com. Only 404 envelopes are reachable without a key, so
    absence here is a weak negative for the authenticated surface — it is recorded as
    "not observed", not as "no limits exist".
responseCodes:
  throttled: null
  quotaExceeded: null
  note: Exhaustion status code is not published.
policies: []
evidence:
  - url: https://docs.theyeeld.com/integrations/merchant
    status: 200
    note: Full integration guide; no limits, quotas or backoff guidance.
  - url: https://docs.theyeeld.com/integrations/platforms-and-marketplaces
    status: 200
    note: >-
      Platform guide instructs a call per transaction and a re-call on payment-method
      change, with no stated ceiling on call volume.
  - url: https://api.theyeeld.com/
    status: 404
    note: No rate-limit headers on the response.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
